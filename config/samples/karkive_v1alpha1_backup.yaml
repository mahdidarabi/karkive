apiVersion: karkive.io/v1alpha1
kind: Backup
metadata:
  name: app-postgres
  namespace: backup
spec:
  engine: postgres
  schedule: "0 2 * * *"
  database:
    host: postgres.example.svc.cluster.local
    port: 5432
    name: app
  s3:
    endpoint: https://s3.example.com
    bucket: backups
    path: app/pgdump
    retentionDays: 14
  secretRef:
    name: backup-app-postgres
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard
  localRetentionDays: 7
  # runtime:
  #   mode: CronJobWithVolumeHolder  # pause pod keeps the PVC attached

