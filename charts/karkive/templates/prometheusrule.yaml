{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "karkive.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "karkive.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: karkive.operator
      rules:
        - alert: KArkiveBackupNotReady
          expr: karkive_backup_ready == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Backup {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} is not Ready
            description: Owned resources have not been Ready for 15m (engine={{`{{ $labels.engine }}`}}). Last Job outcome is a separate alert.
        - alert: KArkiveRestoreNotReady
          expr: karkive_restore_ready == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Restore {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} is not Ready
            description: Owned resources have not been Ready for 15m (engine={{`{{ $labels.engine }}`}}). Last Job outcome is a separate alert.
        - alert: KArkiveBackupJobFailed
          expr: karkive_backup_last_job_info{outcome="Failed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Last backup Job failed for {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}}
            description: Job {{`{{ $labels.job_name }}`}} failed (reason={{`{{ $labels.reason }}`}}, engine={{`{{ $labels.engine }}`}}).
        - alert: KArkiveRestoreJobFailed
          expr: karkive_restore_last_job_info{outcome="Failed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Last restore Job failed for {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}}
            description: Job {{`{{ $labels.job_name }}`}} failed (reason={{`{{ $labels.reason }}`}}, engine={{`{{ $labels.engine }}`}}).
        - alert: KArkiveBackupAging
          expr: |-
            karkive_backup_suspended == 0
            and (time() - karkive_backup_last_successful_timestamp_seconds) > {{ .Values.metrics.prometheusRule.backupAgingSeconds }}
            and (time() - karkive_backup_last_successful_timestamp_seconds) <= {{ .Values.metrics.prometheusRule.backupStaleSeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Backup {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} success is older than {{ .Values.metrics.prometheusRule.backupAgingSeconds }}s
            description: Last success is between {{ .Values.metrics.prometheusRule.backupAgingSeconds }}s and {{ .Values.metrics.prometheusRule.backupStaleSeconds }}s ago (engine={{`{{ $labels.engine }}`}}).
        - alert: KArkiveBackupStale
          expr: |-
            karkive_backup_suspended == 0
            and (time() - karkive_backup_last_successful_timestamp_seconds) > {{ .Values.metrics.prometheusRule.backupStaleSeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Backup {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} has not succeeded recently
            description: No successful backup within {{ .Values.metrics.prometheusRule.backupStaleSeconds }}s.
        - alert: KArkiveBackupNoFinishedJob
          expr: |-
            karkive_backup_last_schedule_timestamp_seconds
            unless ignoring(outcome, reason, job_name) karkive_backup_last_job_info
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Backup {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} has been scheduled but no Job has finished
            description: CronJob has a last schedule and karkive_backup_last_job_info is absent (engine={{`{{ $labels.engine }}`}}).
        - alert: KArkiveRestoreNoFinishedJob
          expr: |-
            karkive_restore_last_schedule_timestamp_seconds
            unless ignoring(outcome, reason, job_name) karkive_restore_last_job_info
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Restore {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} has been scheduled but no Job has finished
            description: CronJob has a last schedule and karkive_restore_last_job_info is absent (engine={{`{{ $labels.engine }}`}}).
        - alert: KArkiveCronJobMissedSchedule
          expr: |-
            kube_cronjob_spec_suspend == 0
            and time() - kube_cronjob_next_schedule_time{cronjob=~"karkive-(backup|restore)-.*"} > {{ .Values.metrics.prometheusRule.missedScheduleGraceSeconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: CronJob {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} missed its next schedule
            description: Requires kube-state-metrics. The next_schedule_time is more than {{ .Values.metrics.prometheusRule.missedScheduleGraceSeconds }}s in the past.
{{- end }}
