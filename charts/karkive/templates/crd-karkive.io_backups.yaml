              lastJob:
                description: LastJob is the most recently finished Job, including
                  failure reason.
                properties:
                  completionTime:
                    description: CompletionTime when the Job finished (or the condition
                      transition time).
                    format: date-time
                    type: string
                  message:
                    description: Message from that condition.
                    type: string
                  name:
                    description: Name of the Job.
                    type: string
                  outcome:
                    description: Outcome is Succeeded or Failed.
                    type: string
                  reason:
                    description: Reason from the JobComplete or JobFailed condition
                      (e.g. BackoffLimitExceeded).
                    type: string
                  startTime:
                    description: StartTime of the Job.
                    format: date-time
                    type: string
                type: object
              lastScheduleTime:
                description: LastScheduleTime copied from the CronJob.
                format: date-time
                type: string
              lastSuccessfulTime:
                description: LastSuccessfulTime copied from the CronJob.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is admission of owned resources: Pending, Ready, Error, Unsupported.
                  It is not the last Job outcome; see BackupSucceeded.
                type: string
              volumeHolderName:
                description: |-
                  VolumeHolderName is the pause Deployment that keeps the PVC attached.
                  Empty unless spec.runtime.mode is CronJobWithVolumeHolder.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
