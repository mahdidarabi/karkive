crds:
  install: true

image:
  repository: ghcr.io/mahdidarabi/karkive
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

leaderElection: true

# Empty = watch all namespaces.
watchNamespace: ""

# Validating admission webhooks for Backup / Restore specs.
# Disabled for `make run`; the chart enables them and mounts serving certs.
webhook:
  enabled: true
  # GitOps: set enabled true so Helm does not generate a random serving cert.
  # cert-manager must already be in the cluster. Switching from the
  # Helm-generated Secret: delete it once so cert-manager can create it.
  certManager:
    enabled: false
    duration: 8760h
    renewBefore: 720h
    # Empty = chart creates a self-signed Issuer in the release namespace.
    issuerRef: {}
    #   name: my-issuer
    #   kind: ClusterIssuer
    #   group: cert-manager.io

defaults:
  # cleanup + compress (find, gzip)
  busyboxImage: docker.io/library/busybox:1.37
  # encrypt (gpg)
  gnupgImage: docker.io/vladgh/gpg:1.3.11
  # pg_dump / psql (backup + restore)
  postgresImage: docker.io/cloudnative-pg/postgresql:18.4
  mcImage: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
  mariadbImage: docker.io/library/mariadb:10.6
  redisImage: docker.io/library/redis:7.4
  # GNU tar for engine pvc (pvcdump)
  tarImage: docker.io/library/debian:trixie-slim
  s3:
    endpoint: ""
    bucket: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

metrics:
  enabled: true
  port: 8080
  service:
    type: ClusterIP
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Dashboard orange: oldest success older than this (default 8h).
    backupAgingSeconds: 28800
    # Dashboard red: no success within this many seconds (default 36h).
    backupStaleSeconds: 129600
    missedScheduleGraceSeconds: 1800
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    # Folder path for the Grafana sidecar. Written under folderKey as an
    # annotation (nested paths like Platform/KArkive are kept) and as a
    # label (`/` becomes `-`, Kubernetes label values cannot contain `/`).
    # Set folderKey to match Grafana sidecar.dashboards.folderAnnotation.
    folder: ""
    folderKey: grafana_folder
    annotations: {}

probes:
  port: 8081

nodeSelector: {}
tolerations: []
affinity: {}
